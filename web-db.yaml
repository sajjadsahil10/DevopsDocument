---
- name: Install httpd server
  hosts: web*
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Install httpd
      yum:
        name: httpd
        state: present
    - name: Start httpd service
      service:
        name: httpd
        state: started
        enabled: yes
- name: Install mariadb server
  hosts: db01
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Install mariadb
      yum:
        name: mariadb-server
        state: present
    - name: Start mariadb service
      service:
        name: mariadb
        state: started
        enabled: yes
    