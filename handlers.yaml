- name: Configure and Start Nginx
  hosts: webservers
  become: yes
  tasks:
    - name: Copy Nginx configuration file
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart Nginx  # This "triggers" the handler if the file changes

    - name: Ensure Nginx is started
      service:
        name: nginx
        state: started

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted